<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A private, local-first journal with margins for your thoughts." />
    <meta name="theme-color" content="#24212a" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Reverie Journal</title>
    <script>
      // Set the theme before first paint to avoid a flash of the wrong colors.
      // The saved preference lives in IndexedDB; this localStorage copy is only a paint-time hint.
      var t = null
      try { t = localStorage.getItem('reverie-theme') } catch (e) {}
      document.documentElement.dataset.theme =
        t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
