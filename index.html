<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A private, local-first journal with margins for your thoughts." />
    <meta name="theme-color" content="#24212a" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Reverie Journal</title>
    <script>
      // Paint the chosen style and light/dark mode before the app loads, to avoid a flash of
      // the wrong look. Preferences live in IndexedDB; this localStorage copy is only a hint
      // (written by src/themes/applyAesthetic.ts).
      ;(function () {
        var saved = null
        try { saved = JSON.parse(localStorage.getItem('reverie-paint') || 'null') } catch (e) {}
        var theme = saved && saved.theme
        var mode = theme === 'light' || theme === 'dark' ? theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        var root = document.documentElement
        root.dataset.theme = mode
        var vars = saved && saved[mode]
        if (vars) for (var name in vars) root.style.setProperty(name, vars[name])
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
